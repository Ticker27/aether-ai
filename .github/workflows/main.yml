name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  GRADLE_VERSION: 8.0
  JDK_VERSION: 17

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Extract ZIP if present
      - name: Extract project files
        run: |
          cd ${{ github.workspace }}
          if [ -f "aether-ai-complete.zip" ]; then
            unzip -q aether-ai-complete.zip
            echo "✅ ZIP extracted successfully"
          fi
          ls -la

      # Setup Java
      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: 'temurin'
          cache: gradle

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          ndk-version: 25.1.8937393

      # Make Gradle executable
      - name: Make gradlew executable
        run: |
          chmod +x aether-ai-complete/gradlew
          ls -la aether-ai-complete/gradle/wrapper/ 2>/dev/null || echo "Checking wrapper..."

      # Initialize Gradle wrapper (download dependencies)
      - name: Initialize Gradle wrapper
        run: |
          cd aether-ai-complete
          # First, just check gradle version to initialize
          ./gradlew --version --quiet 2>&1 || true
          echo "Gradle initialized"

      # Validate and regenerate Gradle wrapper if needed
      - name: Validate Gradle wrapper
        run: |
          cd aether-ai-complete
          # Check if wrapper jar exists
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar not found, regenerating wrapper..."
            ./gradlew wrapper --gradle-version ${{ env.GRADLE_VERSION }} --quiet 2>&1 || true
          else
            echo "✅ gradle-wrapper.jar found"
          fi
          ls -la gradle/wrapper/

      # Clean build
      - name: Clean build
        run: |
          cd aether-ai-complete
          ./gradlew clean --quiet

      # ✅ Compile Gradle build
      - name: Compile Gradle build
        run: |
          cd aether-ai-complete
          ./gradlew build -x test --stacktrace --info
        continue-on-error: false

      # ✅ Run tests
      - name: Run unit tests
        run: |
          cd aether-ai-complete
          ./gradlew test --stacktrace
        continue-on-error: true

      # ✅ Build Debug APK
      - name: Build Debug APK
        run: |
          cd aether-ai-complete
          ./gradlew assembleDebug --stacktrace --info
        continue-on-error: false

      # Build Release APK
      - name: Build Release APK
        run: |
          cd aether-ai-complete
          ./gradlew assembleRelease --stacktrace --info 2>&1 || \
          ./gradlew bundleRelease --stacktrace --info 2>&1 || true
        continue-on-error: true

      # List built APKs
      - name: List built artifacts
        if: always()
        run: |
          echo "📦 Built APK Files:"
          find aether-ai-complete/app/build/outputs -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20
          echo ""
          echo "📋 Build outputs structure:"
          find aether-ai-complete/app/build/outputs -type d 2>/dev/null | head -10

      # Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: aether-ai-complete/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30

      # Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apk
          path: aether-ai-complete/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      # Upload Bundle (AAB)
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-bundle
          path: aether-ai-complete/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30

      # Publish test results
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: aether-ai-complete/app/build/test-results/**/*.xml
          check_name: Unit Test Results
          comment_mode: always
        continue-on-error: true

      # Generate build summary
      - name: Build Summary
        if: always()
        run: |
          cd aether-ai-complete
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Java Version:** ${{ env.JDK_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Gradle Version:** $(./gradlew -v 2>/dev/null | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count APKs built
          if [ -d "app/build/outputs/apk/debug" ]; then
            DEBUG_COUNT=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | wc -l)
            echo "**Debug APKs:** $DEBUG_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -d "app/build/outputs/apk/release" ]; then
            RELEASE_COUNT=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | wc -l)
            echo "**Release APKs:** $RELEASE_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
