name: Build Aether APK

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Ensure gradle wrapper (android/)
        working-directory: android
        run: |
          # settings.gradle reads local.properties for flutterSdkPath; ensure it
          # exists so `gradle wrapper` can evaluate before `flutter build` regenerates it.
          if [ ! -f local.properties ]; then
            echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
            echo "sdk.dir=$ANDROID_HOME" >> local.properties
          fi
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/g.zip
            unzip -q /tmp/g.zip -d /opt
            /opt/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
