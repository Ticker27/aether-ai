name: Build Aether APK

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      patch_name:
        description: 'Patch file name'
        required: false
        default: ''
      patch_b64:
        description: 'Patch content (base64)'
        required: false
        default: ''
      triggered_by:
        description: 'Who triggered'
        required: false
        default: 'manual'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Export Flutter path
        run: |
          echo "FLUTTER_ROOT=${{ steps.setup-flutter.outputs.path }}" >> $GITHUB_ENV
          echo "flutter.sdk=${{ steps.setup-flutter.outputs.path }}" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create local.properties
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0" >> android/local.properties
          cat android/local.properties

      - name: Ensure gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/g.zip
            unzip -q /tmp/g.zip -d /opt
            /opt/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Apply Patch (if provided)
        if: github.event.inputs.patch_b64 != ''
        run: |
          echo "[PATCH] Applying patch: ${{ github.event.inputs.patch_name }}"
          echo "${{ github.event.inputs.patch_b64 }}" | base64 -d > /tmp/patch.zip
          python3 tools/patch_engine/patch.py /tmp/patch.zip --repo-root . --token ${{ secrets.GITHUB_TOKEN }}

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: aether-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
